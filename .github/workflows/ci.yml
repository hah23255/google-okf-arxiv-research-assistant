name: CI

on:
  push:
  pull_request:

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run python -m pytest -p no:cacheprovider

      - name: Check docs links
        run: uv run python scripts/check_docs_links.py

      - name: Frontend import smoke
        run: uv run python -c "import streamlit; import app"

      - name: Run smoke checks
        run: bash scripts/ci_smoke.sh
